[project]
name = "document-qa"
version = "0.1.0"
description = "Document question-answering service with retrieval-augmented generation"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
# PLR0913: service functions legitimately take many parameters
# PLR2004: status codes in tests are self-explanatory
# PLW0603: module-level handles loaded at startup are the standard FastAPI pattern
ignore = ["PLR0913", "PLR2004", "PLW0603"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/"]
