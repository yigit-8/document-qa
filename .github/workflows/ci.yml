name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # The retrieval eval pulls the sentence-transformer from the Hub on
      # every run otherwise. Key on the model name so switching models
      # invalidates the cache.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sentence-transformers-all-MiniLM-L6-v2
          restore-keys: |
            hf-sentence-transformers-

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: test-key

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t document-qa:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag document-qa:${{ github.sha }} ghcr.io/yigitliman/document-qa:latest
          docker tag document-qa:${{ github.sha }} ghcr.io/yigitliman/document-qa:${{ github.sha }}
          docker push ghcr.io/yigitliman/document-qa:latest
          docker push ghcr.io/yigitliman/document-qa:${{ github.sha }}
